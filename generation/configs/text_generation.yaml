model:
  name: ../artifacts/Qwen3-VL-4B-Instruct
  revision: main
  local_files_only: true
  device: cuda
  device_map: auto
  dtype: auto
  load_in_4bit: false
  batch_size: 1
  max_image_pixels: 200704
  min_image_pixels: 4096
  attn_implementation: sdpa
  clear_cache: true
  cpu_memory: 24GiB
generation:
  do_sample: false
  max_new_tokens: 1024
  max_retries: 3
  language: en
  descriptions_per_type: 2
  min_words: 4
  max_words: 80
  types:
  - detailed
  - concise
  - partial
  - relational
dataset:
  name: gsv_cities
  root: ../datasets/GSVCities
  index: outputs/data/places.jsonl
  max_places: 100
  max_views_per_place: 4
  random_seed: 42
protocol:
  protocol: B
  source_panorama_groups: 2
  duplicate_hamming: 4
fusion:
  attribute_similarity_threshold: 0.85
  min_shared_views: 2
  min_support: 0.5
  min_confidence: 0.5
processing:
  resume: true
  cache_enabled: true
  save_intermediate: true
  validate_json: true
quality:
  enabled: true
  enable_grounding_check: true
  enable_hallucination_check: true
  enable_consistency_check: true
  enable_duplication_check: true
  enable_discrimination_check: true
  enable_length_check: true
  retain_uncertain: true
  vlm_verification: false
  threshold: 0.0
  min_words: 4
  max_words: 100
  duplicate_jaccard: 0.9
  weights:
  - 0.5
  - 0.3
  - 0.2
output:
  directory: outputs
  compatibility_annotations: outputs/text/annotations.jsonl
