[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acrossplace"
version = "1.0.0"
description = "AcrossPlace benchmark: cross-view bidirectional language–vision place recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.57.6",
  "peft==0.18.0",
  "accelerate==1.11.0",
  "numpy==1.26.4",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "safetensors==0.7.0",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4,<7",
  "huggingface-hub>=0.34,<1",
  "pytorch-metric-learning==2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
analysis = ["matplotlib>=3.7,<4"]

[project.scripts]
place-retrieval = "place_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
